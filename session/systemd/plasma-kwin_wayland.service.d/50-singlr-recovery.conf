[Unit]
# Recuperación opcional (fail open): si quedó pendiente restaurar la decoración y los efectos de KWin
# tras una sesión Singlr interrumpida, se restaura antes de arrancar KWin. Un fallo de la recuperación
# nunca debe impedir que Plasma arranque: por eso Wants= y no Requires=.
Wants=singlr-kwin-recover.service
After=singlr-kwin-recover.service
